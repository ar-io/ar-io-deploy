name: 'ARIO Deploy'
description: 'Deploy static sites to Arweave and update ArNS records. Perfect for PR previews and production deployments.'
author: 'Permanent Data Solutions, Inc.'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  deploy-key:
    description: 'Upload key (pays for the upload): Arweave JWK wallet (base64-encoded or JSON string), or raw private key for Ethereum/Polygon signers, or a base58 secret key for Solana'
    required: true
  arns-key:
    description: 'ArNS authority key: base58-encoded Solana secret key that controls the ArNS name and signs the record update. Separate from the upload key.'
    required: true
  arns-name:
    description: 'The ArNS name to update (e.g., "myapp" for myapp.turbo-gateway.com)'
    required: true
  undername:
    description: 'The undername to use. Use "@" for base name, or a custom value for undernames (e.g., "docs" for docs_myapp.turbo-gateway.com)'
    required: false
    default: '@'
  deploy-folder:
    description: 'Path to the folder containing built static files to deploy'
    required: false
    default: './dist'
  deploy-file:
    description: 'Path to a single file to deploy (alternative to deploy-folder)'
    required: false
  fallback-file:
    description: 'Path, relative to deploy-folder, served for routes the manifest does not list (e.g. index.html for a single-page app). Defaults to 404.html when present.'
    required: false
  ttl-seconds:
    description: 'TTL in seconds for the ANT record (60-86400)'
    required: false
    default: '3600'
  sig-type:
    description: 'Signer type for the upload key that pays for the upload (arweave, ethereum, polygon, solana).'
    required: false
    default: 'arweave'
  cluster:
    description: 'Solana cluster for ArNS updates (mainnet or devnet)'
    required: false
    default: 'mainnet'
  rpc-url:
    description: 'Optional Solana RPC URL override for ArNS updates'
    required: false
  skip-arns-check:
    description: 'Update the ArNS record even if arns-key does not appear to own or control the name (e.g. right after a transfer). Without it, such a deploy fails before uploading.'
    required: false
    default: 'false'
  on-demand:
    description: 'Top up Turbo credits with this token if the balance cannot cover the upload. Solana keys: ario, solana, solana-usdc. EVM keys: base-eth, base-usdc. Requires max-token-amount.'
    required: false
  max-token-amount:
    description: 'Most the on-demand top-up may spend, in whole tokens (required with on-demand)'
    required: false
  paid-by:
    description: 'Comma-separated wallets whose shared credits pay for the upload (defaults to every wallet that shared credits with the upload key)'
    required: false
  ignore-approvals:
    description: "Ignore shared credits; pay only from the upload key's own balance"
    required: false
    default: 'false'
  use-signer-balance-first:
    description: "Spend the upload key's own balance before shared credits"
    required: false
    default: 'false'
  dev:
    description: "Use Turbo's development sandbox (upload and payment services together)"
    required: false
    default: 'false'
  uploader:
    description: 'Custom Turbo upload service URL (defaults to production; see dev for the sandbox).'
    required: false
  payment-url:
    description: 'Custom Turbo payment service URL (follows uploader when that is the sandbox)'
    required: false
  preview:
    description: 'Enable preview mode: auto-generates undername from PR number and posts a comment with the preview URL. Preview undernames are not removed when the PR closes.'
    required: false
    default: 'false'
  auto-undername:
    description: 'Automatically generate undername from PR number or branch name (use preview for full PR preview functionality)'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for posting PR comments (required when preview is enabled; needs pull-requests: write)'
    required: false
  no-dedupe:
    description: 'Disable deduplication (do not cache or reuse previous uploads). By default, ario-deploy caches your deployment log to prevent uploading duplicate (unchanged) files.'
    required: false
    default: 'false'
  dedupe-cache-max-entries:
    description: 'Maximum number of entries to keep in the dedupe cache (LRU). Default is 10000.'
    required: false
  incremental:
    description: "Reuse files already on Arweave. Publishes each file's content hash as a tag and recovers transaction ids the restored cache is missing by querying this wallet's past uploads, so a redeploy pays only for the files that actually changed. Off by default."
    required: false
    default: 'false'
  incremental-gateway:
    description: 'Gateway whose GraphQL endpoint is queried for past uploads when incremental is enabled. Defaults to https://turbo-gateway.com, where Turbo uploads are indexed first.'
    required: false
  compress:
    description: 'Compress files before upload and tag them with Content-Encoding: gzip, br, or none. Gateways serve the encoded bytes to every client, so prefer gzip unless you know your clients accept br. Already-compressed formats (JPEG, PNG, GIF, WebP, AVIF, WOFF/WOFF2, MP3, MP4, WebM, zip/gz and other archives) are uploaded as-is.'
    required: false
    default: 'none'
  compress-exclude:
    description: 'Comma-separated globs of files to upload uncompressed (e.g. "llms*.txt,*.md"). A pattern without "/" matches the file name in any directory. No spaces: the value is passed to the CLI unquoted.'
    required: false

outputs:
  tx-id:
    description: 'The Arweave transaction ID of the uploaded content'
    value: ${{ steps.deploy.outputs.tx-id }}
  deployment-url:
    description: 'The full URL where the deployment is accessible'
    value: ${{ steps.deploy.outputs.deployment-url }}
  undername-used:
    description: 'The undername that was used for the deployment'
    value: ${{ steps.deploy.outputs.undername-used }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        # setup-node@v5 auto-caches when the repo's package.json declares a
        # `packageManager`, and fails the run if the matching lockfile is
        # absent. This action only needs a Node runtime to install its own
        # CLI — it has no business touching the caller's dependency cache,
        # and guessing wrong breaks their deploy.
        package-manager-cache: false

    # Pinned to the major this action tag represents. Unpinned, `@v2` would
    # silently install a future 3.x mid-deploy for every consumer — the exact
    # thing a major tag is supposed to prevent.
    - name: Install ario-deploy
      shell: bash
      run: npm install -g @ar.io/deploy@^2

    # One cache entry per run, restored by prefix: the newest entry this ref
    # (or its base branch) can see. Nothing is deleted, so no extra token
    # permissions are needed and one branch can never wipe another's cache.
    # The whole directory is kept: per-network caches and any top-up that was
    # sent but not yet credited live there too.
    - name: Restore transaction cache
      id: cache-restore
      if: inputs.no-dedupe != 'true' && github.event.action != 'closed'
      uses: actions/cache/restore@v5
      with:
        path: .ario-deploy
        key: ario-deploy-cache-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ario-deploy-cache-

    - name: Determine undername
      id: undername
      if: github.event.action != 'closed'
      shell: bash
      env:
        UNDERNAME: ${{ inputs.undername }}
        AUTO_UNDERNAME: ${{ inputs.auto-undername }}
        PREVIEW: ${{ inputs.preview }}
        REPO: ${{ github.event.repository.name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        # Every value arrives through env, never pasted into the script: a
        # branch name is attacker-chosen text, and this step runs with secrets.
        sanitize() {
          printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9_-]/-/g' -e 's/--*/-/g' -e 's/^[-_]*//' -e 's/-$//'
        }

        if [[ "$PREVIEW" == "true" ]]; then
          AUTO_UNDERNAME="true"
        fi

        if [[ "$AUTO_UNDERNAME" == "true" && "$UNDERNAME" == "@" ]]; then
          REPO_NAME=$(sanitize "$REPO")
          if [[ -n "$PR_NUMBER" ]]; then
            UNDERNAME="${REPO_NAME}-pr-${PR_NUMBER}"
            echo "Auto-generated undername from PR: $UNDERNAME"
          elif [[ -n "$REF_NAME" && "$REF_NAME" != "main" && "$REF_NAME" != "master" ]]; then
            UNDERNAME="${REPO_NAME}-$(sanitize "$REF_NAME")"
            echo "Auto-generated undername from branch: $UNDERNAME"
          fi

          # The ANT program accepts at most 61 characters.
          if [[ ${#UNDERNAME} -gt 61 ]]; then
            UNDERNAME="${UNDERNAME:0:61}"
            UNDERNAME="${UNDERNAME%-}"
            echo "Truncated undername to 61 characters: $UNDERNAME"
          fi
        fi

        echo "undername=$UNDERNAME" >> "$GITHUB_OUTPUT"

    - name: Deploy to Permaweb
      id: deploy
      if: github.event.action != 'closed'
      shell: bash
      env:
        DEPLOY_KEY: ${{ inputs.deploy-key }}
        ARNS_KEY: ${{ inputs.arns-key }}
        NO_COLOR: '1'
        IN_ARNS_NAME: ${{ inputs.arns-name }}
        IN_UNDERNAME: ${{ steps.undername.outputs.undername }}
        IN_TTL: ${{ inputs.ttl-seconds }}
        IN_SIG_TYPE: ${{ inputs.sig-type }}
        IN_CLUSTER: ${{ inputs.cluster }}
        IN_RPC_URL: ${{ inputs.rpc-url }}
        IN_SKIP_ARNS_CHECK: ${{ inputs.skip-arns-check }}
        IN_DEPLOY_FILE: ${{ inputs.deploy-file }}
        IN_DEPLOY_FOLDER: ${{ inputs.deploy-folder }}
        IN_FALLBACK_FILE: ${{ inputs.fallback-file }}
        IN_ON_DEMAND: ${{ inputs.on-demand }}
        IN_MAX_TOKEN_AMOUNT: ${{ inputs.max-token-amount }}
        IN_PAID_BY: ${{ inputs.paid-by }}
        IN_IGNORE_APPROVALS: ${{ inputs.ignore-approvals }}
        IN_SIGNER_FIRST: ${{ inputs.use-signer-balance-first }}
        IN_DEV: ${{ inputs.dev }}
        IN_UPLOADER: ${{ inputs.uploader }}
        IN_PAYMENT_URL: ${{ inputs.payment-url }}
        IN_NO_DEDUPE: ${{ inputs.no-dedupe }}
        IN_CACHE_MAX: ${{ inputs.dedupe-cache-max-entries }}
        IN_INCREMENTAL: ${{ inputs.incremental }}
        IN_INCREMENTAL_GATEWAY: ${{ inputs.incremental-gateway }}
        IN_COMPRESS: ${{ inputs.compress }}
        IN_COMPRESS_EXCLUDE: ${{ inputs.compress-exclude }}
      run: |
        # An Arweave JWK given as JSON is base64-encoded for the CLI.
        if [[ "$DEPLOY_KEY" =~ ^\{.*\}$ ]]; then
          DEPLOY_KEY=$(printf '%s' "$DEPLOY_KEY" | base64 -w0)
        fi
        export DEPLOY_KEY ARNS_KEY

        # Arguments as an array: no word splitting, no globbing, no injection.
        ARGS=(--arns-name "$IN_ARNS_NAME" --undername "$IN_UNDERNAME" --ttl-seconds "$IN_TTL"
              --sig-type "$IN_SIG_TYPE" --cluster "$IN_CLUSTER")
        [[ -n "$IN_RPC_URL" ]] && ARGS+=(--rpc-url "$IN_RPC_URL")
        [[ "$IN_SKIP_ARNS_CHECK" == "true" ]] && ARGS+=(--skip-arns-check)
        if [[ -n "$IN_DEPLOY_FILE" ]]; then
          ARGS+=(--deploy-file "$IN_DEPLOY_FILE")
        else
          ARGS+=(--deploy-folder "$IN_DEPLOY_FOLDER")
        fi
        [[ -n "$IN_FALLBACK_FILE" ]] && ARGS+=(--fallback-file "$IN_FALLBACK_FILE")
        if [[ -n "$IN_ON_DEMAND" ]]; then
          ARGS+=(--on-demand "$IN_ON_DEMAND")
          [[ -n "$IN_MAX_TOKEN_AMOUNT" ]] && ARGS+=(--max-token-amount "$IN_MAX_TOKEN_AMOUNT")
        fi
        [[ -n "$IN_PAID_BY" ]] && ARGS+=(--paid-by "$IN_PAID_BY")
        [[ "$IN_IGNORE_APPROVALS" == "true" ]] && ARGS+=(--ignore-approvals)
        [[ "$IN_SIGNER_FIRST" == "true" ]] && ARGS+=(--use-signer-balance-first)
        [[ "$IN_DEV" == "true" ]] && ARGS+=(--dev)
        [[ -n "$IN_UPLOADER" ]] && ARGS+=(--uploader "$IN_UPLOADER")
        [[ -n "$IN_PAYMENT_URL" ]] && ARGS+=(--payment-url "$IN_PAYMENT_URL")
        if [[ "$IN_NO_DEDUPE" == "true" ]]; then
          ARGS+=(--no-dedupe)
        elif [[ -n "$IN_CACHE_MAX" ]]; then
          ARGS+=(--dedupe-cache-max-entries "$IN_CACHE_MAX")
        fi
        # Passed through even alongside no-dedupe, so the CLI refuses the
        # combination out loud rather than this step silently dropping it.
        if [[ "$IN_INCREMENTAL" == "true" ]]; then
          ARGS+=(--incremental)
          [[ -n "$IN_INCREMENTAL_GATEWAY" ]] && ARGS+=(--incremental-gateway "$IN_INCREMENTAL_GATEWAY")
        fi
        if [[ -n "$IN_COMPRESS" && "$IN_COMPRESS" != "none" ]]; then
          ARGS+=(--compress "$IN_COMPRESS")
          [[ -n "$IN_COMPRESS_EXCLUDE" ]] && ARGS+=(--compress-exclude "$IN_COMPRESS_EXCLUDE")
        fi

        echo "Running: ario-deploy deploy ${ARGS[*]}"
        set +e
        OUTPUT=$(ario-deploy deploy "${ARGS[@]}" 2>&1)
        STATUS=$?
        set -e
        echo "$OUTPUT"

        # The CLI prints "Tx ID: <id>" as soon as the upload lands, before the
        # ArNS update, so the id is reported even when that update fails.
        TX_ID=$(printf '%s\n' "$OUTPUT" | sed -n 's/^Tx ID: \([A-Za-z0-9_-]\{43\}\)$/\1/p' | head -1)
        echo "tx-id=$TX_ID" >> "$GITHUB_OUTPUT"
        echo "undername-used=$IN_UNDERNAME" >> "$GITHUB_OUTPUT"

        if [[ "$STATUS" -ne 0 ]]; then
          echo "::error::Deployment failed (exit $STATUS)"
          exit "$STATUS"
        fi

        if [[ "$IN_UNDERNAME" == "@" ]]; then
          DEPLOYMENT_URL="https://${IN_ARNS_NAME}.ar.io"
        else
          DEPLOYMENT_URL="https://${IN_UNDERNAME}_${IN_ARNS_NAME}.ar.io"
        fi
        echo "deployment-url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
        echo "Deployment URL: $DEPLOYMENT_URL"

    - name: Save transaction cache
      if: inputs.no-dedupe != 'true' && github.event.action != 'closed' && always()
      uses: actions/cache/save@v5
      continue-on-error: true
      with:
        path: .ario-deploy
        key: ario-deploy-cache-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Comment on PR
      if: inputs.preview == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed'
      uses: actions/github-script@v7
      env:
        DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        TX_ID: ${{ steps.deploy.outputs.tx-id }}
        UNDERNAME: ${{ steps.deploy.outputs.undername-used }}
        ARNS_NAME: ${{ inputs.arns-name }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { DEPLOYMENT_URL, TX_ID, UNDERNAME, ARNS_NAME } = process.env

          const body = `## Permaweb Preview Deployed

          Your preview is available at: **${DEPLOYMENT_URL}**

          | Property | Value |
          |----------|-------|
          | Transaction ID | \`${TX_ID}\` |
          | ArNS Name | ${ARNS_NAME} |
          | Undername | ${UNDERNAME} |

          > This preview will be available permanently on Arweave via the [AR.IO Network](https://ar.io).`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const botComment = comments.find((comment) =>
            comment.body.includes('Permaweb Preview Deployed'),
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
